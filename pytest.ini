[pytest]
pythonpath = . tests
addopts = --cov=models --cov=database --cov=data_export --cov=logger_config --cov=main_cli --cov=main_gui --cov-report=term-missing

[coverage:run]
source =
    models
    database
    data_export
    logger_config
    main_cli
    main_gui

[coverage:report]
fail_under = 60
show_missing = True
